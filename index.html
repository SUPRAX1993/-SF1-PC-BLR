<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة P2P للتبادل الرقمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>سوق التبادل المباشر (P2P)</h1>
        <div class="tabs">
            <button onclick="showAds('buy')" id="buy-tab" class="active">شراء</button>
            <button onclick="showAds('sell')" id="sell-tab">بيع</button>
        </div>
    </header>

    <main id="ads-container">
        </main>

    <div id="trade-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">تنفيذ طلب</h2>
            <div id="modal-body"></div>
            <button class="btn-main" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
