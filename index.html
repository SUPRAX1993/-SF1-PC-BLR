<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF1-PC ULTIMATE BUILDER</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3CRJB44J2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3CRJB44J2');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-panel: #141414;
            --text-primary: #ecf0f1;
            --accent-color: #00f2c3;
            --border-color: #2c2c2c;
            --panel-shadow: 0 10px 40px rgba(0, 242, 195, 0.15);
        }

        [data-theme="light"] {
            --bg-main: #f4f7f6;
            --bg-panel: #ffffff;
            --text-primary: #2c3e50;
            --accent-color: #3498db;
            --border-color: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-main); color: var(--text-primary); }

        header { display: flex; justify-content: space-between; padding: 20px 40px; background: var(--bg-panel); border-bottom: 2px solid var(--border-color); }
        .logo { font-family: 'Rajdhani'; font-size: 1.8rem; font-weight: 900; }
        .logo span { color: var(--accent-color); }

        .container { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; max-width: 1400px; margin: 30px auto; padding: 0 20px; }

        .panel { background: var(--bg-panel); border-radius: 20px; padding: 25px; border: 1px solid var(--border-color); box-shadow: var(--panel-shadow); }

        /* البطاقات الجديدة */
        .selection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .part-card {
            background: var(--bg-main); padding: 20px; border-radius: 15px; border: 2px solid var(--border-color);
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .part-card:hover { border-color: var(--accent-color); transform: translateY(-3px); }
        .part-card h4 { font-size: 0.8rem; opacity: 0.7; }
        .part-card p { font-weight: 700; font-size: 0.9rem; color: var(--accent-color); margin-top: 5px; }

        /* لوحة المعاينة */
        .preview-box { text-align: center; position: sticky; top: 100px; }
        #preview-img { max-width: 250px; height: 250px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        
        .price-tag { font-family: 'Rajdhani'; font-size: 3rem; font-weight: 900; color: var(--accent-color); margin-bottom: 20px; }

        .status-box { background: var(--bg-main); padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 0.9rem; border: 1px solid var(--border-color); }

        /* Modal النافذة */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { background: var(--bg-panel); margin: 5% auto; padding: 25px; width: 90%; max-width: 600px; border-radius: 20px; border: 1px solid var(--accent-color); max-height: 80vh; overflow-y: auto; }
        
        .search-bar { width: 100%; padding: 15px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 10px; color: white; margin-bottom: 20px; font-family: 'Cairo'; }

        .part-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .part-item:hover { background: rgba(255,255,255,0.05); }
        
        .info-btn { background: #333; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: help; margin-left: 10px; font-size: 0.7rem; }

        .btn { padding: 12px 25px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-family: 'Cairo'; width: 100%; margin-top: 10px; }
        .btn-main { background: var(--accent-color); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }

        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } .selection-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">SF1-PC <span>ULTIMATE</span></div>
        <button id="theme-toggle" style="background:none; border:none; cursor:pointer; font-size:1.5rem;">🌙</button>
    </header>

    <div class="container">
        <section class="panel">
            <h2 style="margin-bottom:20px;">تخصيص التجميعة</h2>
            <div class="selection-grid" id="cards-container">
                </div>
        </section>

        <section class="panel preview-box">
            <img id="preview-img" src="https://placehold.co/400x400/141414/00f2c3?text=SF1-PC" alt="PC">
            <div class="price-tag">$<span id="total-price">0</span></div>
            
            <div id="comp-status" class="status-box">الحالة: بانتظار القطع</div>
            <div id="bottleneck-status" class="status-box">عنق الزجاجة: --</div>

            <button class="btn btn-main" id="share-btn">📋 نسخ تقرير التجميعة</button>
            <button class="btn btn-outline" onclick="location.reload()">🔄 إعادة تعيين</button>
        </section>
    </div>

    <div id="selection-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom:15px;">اختر قطعة</h3>
            <input type="text" id="part-search" class="search-bar" placeholder="ابحث باسم القطعة...">
            <div id="parts-list"></div>
            <button class="btn btn-outline" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
