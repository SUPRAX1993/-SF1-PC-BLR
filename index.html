<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Wallet | المحفظة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <section class="wallet-header">
            <p class="label">إجمالي الرصيد المقدر</p>
            <h1 class="total-balance"><span id="balance-val">0.00</span> <small>USD</small></h1>
            <p class="sub-balance">≈ 0.00000000 BTC</p>
            
            <div class="action-buttons">
                <button class="btn-yellow">إيداع</button>
                <button class="btn-gray">سحب</button>
                <button class="btn-gray">تحويل</button>
            </div>
        </section>

        <section class="assets-section">
            <div class="section-title">
                <h3>الأصول</h3>
                <span>عرض الكل</span>
            </div>
            <div id="assets-list">
                </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
