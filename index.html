<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3CRJB44J2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3CRJB44J2');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبدع التجميعات SF1-PC 2026</title>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 120px; /* مساحة للوحة النتائج */
        }
        .part-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .part-card:hover { 
            border-color: var(--accent-color);
            transform: translateY(-5px);
        }
        .summary-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            border-top: 5px solid var(--accent-color);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.3);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            width: 90%; max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .part-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #334155;
            transition: 0.2s;
        }
        .part-item:hover { background: rgba(56, 189, 248, 0.1); }
        .btn-main {
            background: var(--accent-color);
            color: white; border: none;
            padding: 12px 25px; border-radius: 10px;
            cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .btn-main:hover { opacity: 0.9; transform: scale(1.05); }
        #part-search {
            width: 100%; padding: 12px;
            margin-bottom: 20px; border-radius: 10px;
            border: 1px solid #334155; background: #0f172a; color: white;
            box-sizing: border-box;
        }
        .info-btn {
            background: #475569; color: white; border: none;
            width: 25px; height: 25px; border-radius: 50%;
            cursor: pointer; margin-left: 10px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div>
            <h1 style="margin:0">SF1-PC <span style="color:var(--accent-color)">BUILDER</span></h1>
            <small style="opacity: 0.7;">الإصدار الاحترافي 2026</small>
        </div>
        <button id="theme-toggle" class="btn-main" style="background:none; font-size: 24px;">🌙</button>
    </header>

    <div class="cards-grid" id="cards-container"></div>

    <div class="summary-panel">
        <div style="display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div style="text-align: center;">
                <span style="opacity: 0.8; display: block;">السعر الإجمالي</span>
                <strong style="font-size: 22px; color: var(--success);">$<span id="total-price">0</span></strong>
            </div>
            <div style="text-align: center;">
                <span style="opacity: 0.8; display: block;">استهلاك الطاقة</span>
                <strong style="font-size: 22px;"><span id="total-wattage">0</span> واط</strong>
            </div>
            <div style="min-width: 220px; text-align: center; border-right: 2px solid #334155; padding-right: 15px;">
                <span id="comp-status" style="font-weight: bold; display: block;">✅ بانتظار القطع</span>
                <small id="bottleneck-status" style="opacity: 0.7;">--</small>
            </div>
            <div>
                <button id="share-btn" class="btn-main">نسخ التقرير 📋</button>
            </div>
        </div>
    </div>

    <div id="selection-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0; color: var(--accent-color);">اختر القطعة</h2>
            <input type="text" id="part-search" placeholder="ابحث باسم القطعة (مثلاً: RTX 5090)...">
            <div id="parts-list"></div>
            <br>
            <button class="btn-main" style="background:#ef4444; width:100%" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center; border: 2px solid var(--accent-color);">
            <h2 id="details-title" style="color: var(--accent-color);">التفاصيل</h2>
            <div id="details-body" style="text-align: right; line-height: 1.8; background: #0f172a; padding: 15px; border-radius: 10px;"></div>
            <br>
            <button class="btn-main" onclick="closeDetails()">إغلاق</button>
        </div>
    </div>

    <img id="preview-img" src="" style="display:none;">

    <script src="script.js"></script>

</body>
</html>
