<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF1-PC-BLR Pro Builder</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3CRJB44J2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3CRJB44J2');
    </script>

    <meta property="og:site_name" content="SF1-PC-BLR">
    <meta property="og:title" content="SF1-PC-BLR Pro Builder">
    <meta property="og:description" content="ابنِ تجميعة أحلامك وافحص التوافق وعنق الزجاجة مجاناً.">
    <meta property="og:image" itemprop="image" content="https://opengraph.githubassets.com/1/supra1993/SF1-PC-BLR">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://supra1993.github.io/SF1-PC-BLR/">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://opengraph.githubassets.com/1/supra1993/SF1-PC-BLR">

<style>        
        body.dark-mode .controls, body.dark-mode .preview { background: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .control-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: #fafafa; }
        body.dark-mode select { background: #2d2d2d; color: white; border-color: #444; }

        .total-box { background: #e8f0fe; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #1a73e8; }
        .total-price { font-size: 2rem; color: #1a73e8; font-weight: bold; }
        body.dark-mode .total-box { background: #0d47a1; color: white; }

        .status-box { padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; border: 1px solid #ddd; background: #f9f9f9; }
        body.dark-mode .status-box { background: #2d2d2d; border-color: #444; }

        #part-image { width: 100%; max-width: 250px; height: 250px; object-fit: contain; margin: 15px 0; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; color: white; transition: 0.2s; }
        .btn-buy { background: #28a745; }
        .btn-share { background: #007bff; }
        
        #dark-mode-toggle { position: fixed; top: 10px; left: 10px; padding: 10px; border-radius: 50%; border: none; cursor: pointer; background: #333; color: white; font-size: 1.2rem; }
    </style>
</head>
<body>

    <button id="dark-mode-toggle">🌙</button>

    <header>
        <h1>SF1-PC-BLR Pro</h1>
        <p>النسخة المتكاملة الذكية</p>
    </header>

    <div class="builder-container">
        <div class="controls">
            <div class="control-group"><label>🔌 المعالج (CPU)</label><select id="cpu-select"></select></div>
            <div class="control-group"><label>🎮 كارت الشاشة (GPU)</label><select id="gpu-select"></select></div>
            <div class="control-group"><label>📟 اللوحة الأم (Motherboard)</label><select id="mobo-select"></select></div>
            <div class="control-group"><label>💾 الرامات (RAM)</label><select id="ram-select"></select></div>
            <div class="control-group"><label>💿 التخزين (Storage)</label><select id="storage-select"></select></div>
            <div class="control-group"><label>❄️ المبرد (Cooler)</label><select id="cooler-select"></select></div>
            <div class="control-group"><label>📦 الصندوق (Case)</label><select id="case-select"></select></div>
            <div class="control-group"><label>⚡ مزود الطاقة (PSU)</label><select id="psu-select"></select></div>
        </div>

        <div class="preview">
            <div class="total-box">
                <span>المجموع الكلي</span>
                <div class="total-price">$<span id="total-price">0</span></div>
            </div>

            <div id="compatibility-check" class="status-box">انتظار اختيار القطع...</div>
            <div id="bottleneck-check" class="status-box">عنق الزجاجة: --</div>

            <img id="part-image" src="https://placehold.co/400x400/eee/999?text=Preview" alt="Part Image">
            <div id="part-name-display" style="margin-bottom:15px; font-weight:bold;"></div>

            <div class="btn-group">
                <button class="btn btn-buy" onclick="window.print()">🖨️ طباعة التجميعة</button>
                <button id="share-btn" class="btn btn-share">📋 نسخ التجميعة للمشاركة</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
